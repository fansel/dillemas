<!doctype html>
<html lang="en">

<title>Who May Read Our Messages? — Privacy vs. State Surveillance</title>
<style>
@font-face { font-family: "Barlow"; src: url(../fonts/Barlow-Regular.ttf); font-weight: 400; }
@font-face { font-family: "Barlow"; src: url(../fonts/Barlow-Medium.ttf); font-weight: 500; }
@font-face { font-family: "Barlow"; src: url(../fonts/Barlow-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: "Barlow"; src: url(../fonts/Barlow-Bold.ttf); font-weight: 700; }
@font-face { font-family: "Barlow"; src: url(../fonts/Barlow-Italic.ttf); font-style: italic; }
@page { size: 1920px 1080px; margin: 0; }
:root { --blue: #211A52; --ink: #2B2B3A; --grey: #6B6B7E; --line: #D9D6EA; --tint: #EEEEF5; --lav: #B9B5D6; --hl: #FFF200; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #444; }
body { font-family: "Barlow", Arial, sans-serif; color: var(--blue); }
.slide { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff; padding: 120px 128px 200px; margin: 0 auto 24px; break-after: page; }
.label { position: absolute; left: 384px; bottom: 62px; font-size: 24px; font-weight: 500; color: var(--grey); }
h2 { font-size: 64px; font-weight: 700; line-height: 1.1; }
.rule { width: 120px; height: 5px; background: var(--blue); margin: 26px 0 44px; }
.lead { font-size: 34px; line-height: 1.4; color: var(--ink); }
.small { font-size: 28px; line-height: 1.4; color: var(--ink); }
.muted { color: var(--grey); }
.big { font-size: 96px; font-weight: 700; line-height: 1; }
.src { position: absolute; left: 128px; bottom: 132px; width: 1664px; font-size: 22px; color: var(--grey); }
.logo { position: absolute; left: 128px; bottom: 52px; height: 56px; }
.page { position: absolute; right: 128px; bottom: 62px; font-size: 24px; font-weight: 600; }
svg { font-family: "Barlow", Arial, sans-serif; display: block; }
.mark { background: linear-gradient(transparent 58%, var(--hl) 58%); }
.dark { background: var(--blue); color: #fff; }
.sec { background: var(--blue); color: #fff; padding: 0; }
.sec .wave { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .22; }
.sec .num { position: absolute; left: 128px; top: 396px; font-size: 32px; font-weight: 500; color: var(--lav); }
.sec h1 { position: absolute; left: 128px; top: 450px; font-size: 120px; font-weight: 700; line-height: 1.05; }
.sec .sub { position: absolute; left: 128px; top: 600px; font-size: 40px; color: var(--lav); }
.sec .wlogo { position: absolute; left: 128px; bottom: 64px; height: 56px; }
.col { display: flex; flex-direction: column; }
.top-line { border-top: 5px solid var(--blue); padding-top: 24px; }
@media print { html, body { background: none; } .slide { margin: 0; } }
</style>
</head>

<script>
  window.T = (tag, attrs, text) => `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ')}>${text ?? ''}</${tag}>`;
</script>
